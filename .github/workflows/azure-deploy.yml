name: Deploy to Azure App Service

# Builds the React frontend (dist/) and packages it together with the Flask
# backend AND its pre-installed Python dependencies, then deploys to the Azure
# App Service (Linux). Dependencies are vendored in CI into
# .python_packages/lib/site-packages so the app runs directly from the deployed
# package without relying on Azure's server-side (Oryx) build. startup.sh puts
# that folder on PYTHONPATH, runs DB migrations, and launches gunicorn.
#
# Authenticates using the repository secret AZURE_WEBAPP_PUBLISH_PROFILE
# (App Service -> Overview -> Download publish profile).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Azure realtime runtime diagnostics
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: python3 scripts/azure-realtime-diagnostics.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        env:
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Test media lifecycle
        run: node --test scripts/test-realtime.cjs

      - name: Assemble deployment package
        run: |
          mkdir -p package
          rsync -a \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='instance' \
            --exclude='var' \
            --exclude='.pytest_cache' \
            --exclude='.env' \
            --exclude='.env.*' \
            backend/ package/backend/
          cp -r dist package/dist
          cp startup.sh package/startup.sh
          cp requirements.txt package/requirements.txt

      - name: Vendor Python dependencies into the package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --target package/.python_packages/lib/site-packages

      - name: Verify Socket.IO application initialization
        env:
          FLASK_ENV: testing
          PROCTORING_SMS_ALERT_ENABLED: "false"
        run: |
          export PYTHONPATH="$PWD/package/backend:$PWD/package/.python_packages/lib/site-packages"
          python - <<'PY'
          from app import create_app
          from app.extensions import socketio
          required = {
              "connect", "disconnect", "join_monitoring", "leave_monitoring",
              "join_session", "webrtc_request", "webrtc_offer", "webrtc_answer",
              "webrtc_ice", "webrtc_stop",
          }
          for _ in range(2):
              app = create_app("testing")
              assert required <= set(socketio.server.handlers.get("/", {}))
              client = socketio.test_client(app)
              assert not client.is_connected(), "Unauthenticated socket was accepted"
          print("Repeated app initialization preserves authenticated monitoring/signaling")
          PY

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: semanticguardai-rw
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: package
