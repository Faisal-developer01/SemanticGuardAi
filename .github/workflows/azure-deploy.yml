name: Deploy to Azure App Service

# Builds the React frontend (dist/) and packages it together with the Flask
# backend, then deploys to the Azure App Service (Linux, Oryx/Python). Oryx
# installs Python deps from requirements.txt server-side; startup.sh runs
# database migrations and launches gunicorn (wsgi:app).
#
# Authenticates to Azure via OIDC federated credentials using repository
# secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID. The
# app registration must have a federated credential trusting this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Assemble deployment package
        run: |
          mkdir -p package
          rsync -a \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='instance' \
            --exclude='var' \
            --exclude='.pytest_cache' \
            --exclude='.env' \
            --exclude='.env.*' \
            backend/ package/backend/
          cp -r dist package/dist
          cp startup.sh package/startup.sh
          cp requirements.txt package/requirements.txt

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: semanticguardai-rw
          package: package
